<div class="pp" id="js-eventPP">
    <div class="pp__wrapper">
        <div class="pp__sticky-close">
            <button class="pp__x-btn x-btn js-ppCloseBtn">
                <svg class="x-btn__icon" width="30" height="30">
                    <use xlink:href="assets/icons/symbols.svg#x"></use>
                </svg>
            </button>
        </div>

        <div class="pp__container">
            <h2 class="pp__title">Заполните форму<br />и мы подберем площадку</h2>

            <form class="pp__form form">
                <!-- Формат мероприятия -->
                <div class="form__section">
                    <div class="form__label">Формат мероприятия:</div>
                    <div class="radio">
                        <label class="radio__item">
                            <input class="radio__input" type="radio" name="format" value="seminar" checked>
                            <span class="radio__mark"></span>
                            <span class="radio__label">Мастер-класс/семинар</span>
                        </label>
                        <label class="radio__item">
                            <input class="radio__input" type="radio" name="format" value="concert">
                            <span class="radio__mark"></span>
                            <span class="radio__label">Концерт/выступление</span>
                        </label>
                        <label class="radio__item">
                            <input class="radio__input" type="radio" name="format" value="exhibition">
                            <span class="radio__mark"></span>
                            <span class="radio__label">Выставка/показ</span>
                        </label>
                        <label class="radio__item">
                            <input class="radio__input" type="radio" name="format" value="other">
                            <span class="radio__mark"></span>
                            <span class="radio__label">Другое</span>
                        </label>
                    </div>
                </div>

                <!-- Количество гостей -->
                <div class="form__section">
                    <label class="field">
                        <span class="field__title">Планируемое количество посетителей:</span>
                        <select class="field__select" name="amount">
                            <option value="20">до 20 человек</option>
                            <option value="100">от 20 до 100 человек</option>
                            <option value="500">от 100 до 500 человек</option>
                            <option value="1000">более 500 человек</option>
                        </select>
                    </label>
                </div>

                <!-- Контакты (имя фамилия) -->
                <div class="form__row">
                    <div class="form__col">
                        <label class="field">
                            <span class="field__label">Имя*</span>
                            <input class="field__input" type="text" placeholder="Имя" name="name" required>
                        </label>
                    </div>
                    <div class="form__col">
                        <label class="field">
                            <span class="field__label">Фамилия*</span>
                            <input class="field__input" type="text" placeholder="Фамилия" name="surname" required>
                        </label>
                    </div>
                </div>

                <!-- Контакты -->
                <div class="form__row">
                    <div class="form__col">
                        <label class="field">
                            <span class="field__label">Телефон*</span>
                            <input class="field__input" type="tel" placeholder="+7" name="phone" required>
                        </label>
                    </div>
                    <div class="form__col">
                        <label class="field">
                            <span class="field__label">Email*</span>
                            <input class="field__input" type="email" placeholder="Email" name="email" required>
                        </label>
                    </div>
                </div>

                <!-- Даты -->
                <div class="form__section">
                    <div class="form__label">Дата проведения:</div>
                    <div class="form__date-row">
                        <input class="field__input field__input--date" type="text" placeholder="ДД" name="day" maxlength="2">
                        <input class="field__input field__input--date" type="text" placeholder="ММ" name="month" maxlength="2">
                        <input class="field__input field__input--date" type="text" placeholder="ГГГГ" name="year" maxlength="4">
                    </div>
                </div>

                <!-- Пожелания -->
                <div class="form__section">
                    <label class="field">
                        <span class="field__title">Есть пожелания? Напишите нам:</span>
                        <textarea class="field__textarea" name="message" rows="3"></textarea>
                    </label>
                </div>

                <!-- Чекбокс -->
                <div class="form__section">
                    <label class="check">
                        <input type="checkbox" name="agree" class="check__input" required checked />
                        <span class="check__mark"></span>
                        <span class="check__label check__label--s">
                            Я соглашаюсь с пользовательским соглашением и с политикой
                            использования персональных данных
                        </span>
                    </label>
                </div>

                <!-- Кнопки -->
                <div class="form__buttons">
                    <button type="submit" class="form__button form__button--submit">Отправить</button>
                    <button type="button" class="form__button form__button--close js-ppCloseBtn" id="closePP">Закрыть</button>
                </div>
            </form>
        </div>
    </div>
</div>
