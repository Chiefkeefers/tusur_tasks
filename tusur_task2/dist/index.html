<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <link rel="stylesheet" href="styles/styles.css">

</head>

<body class="body">
  <header class="header">
    <nav class="navbar">
      <div class="nav-logo">МойСайт</div>
      <div class="nav-links">
        <a href="#home">Главная</a>
        <a href="#about">О нас</a>
        <a href="#services">Услуги</a>
        <a href="#contacts">Контакты</a>
      </div>
    </nav>
  </header>

  <main class="main">
    <article class="event-card  @@class">
      <a href="#" class="event-card__link">
        <picture class="event-card__picture">
          <img src="@@img" alt="@@alt" class="event-card__img" />
        </picture>
        <h4 class="event-card__title">@@title</h4>
        <p class="event-card__description">@@descr</p>
        <time datetime="@@datetime" class="event-card__time">@@time</time>
      </a>
    </article>
    <div class="home">
      <section class="listing home__listing">
        <h2 class="listing__title section-title">Блог</h2>

        <div class="listing__article-list">
          <!-- prettier-ignore -->
          <article class="article-card listing__article-card">
            <a href="#" class="article-card__link">
              <picture class="article-card__picture">
                <img src="assets/images/blog/theatre.jpg" alt="Theatre Photosession" class="article-card__img" />
              </picture>
            </a>

            <div class="article-card__info">
              <time datetime="2021-11-26T00:00" class="article-card__time">26.11.2021</time>
              <a href="#" class="article-card__title-link">
                <h4 class="article-card__title">Фотосессия в стенах Театра драмы</h4>
                <div class="article-card__arrow arrow">
                  <svg class="arrow__icon" width="92" height="62">
                    <use xlink:href="assets/icons/symbols.svg#arrow"></use>
                  </svg>
                </div>
              </a>

              <p class="article-card__description">Организовывая фотосессию для...</p>
            </div>
          </article>
        </div>

        <a href="#" class="listing__link link">Смотреть все</a>
      </section>
    </div>
  </main>

  <footer class="footer" id="contacts">
    <div class="footer-content">
      <div class="footer_social-links">
        <a href="https://t.me/Ch1efTem" aria-label="Telegram">Telegram</a>
        <a href="https://vk.com/silentrewave" aria-label="VK">VK</a>
        <a href="https://github.com/Chiefkeefers" aria-label="GitHub">GitHub</a>
        <a href="mailto:artemshefer3@gmail.com" aria-label="Email">Email</a>
      </div>
    </div>
  </footer>
</body>

</html>
